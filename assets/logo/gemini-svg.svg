<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0" />
    </radialGradient>

    <!-- Main Ribbon Flow Gradient -->
    <linearGradient id="flowGradient" x1="120" y1="380" x2="400" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="55%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#5CFFB5" />
    </linearGradient>

    <!-- Drop Shadow for Crossover Depth -->
    <filter id="crossoverShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Canvas Base -->
  <rect width="512" height="512" rx="112" fill="#0B0F17" />
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Bottom Strand (Flowing under) -->
  <path d="M190 310 C140 360 80 320 80 256 C80 200 140 160 210 220 L270 275 C310 310 360 340 400 290" 
        stroke="url(#flowGradient)" stroke-width="48" stroke-linecap="round" fill="none" />

  <!-- Overlapping Strand & Growth Arrowhead (Tilted 45°) -->
  <g filter="url(#crossoverShadow)">
    <path d="M150 210 C180 170 230 190 280 235 L335 285 C390 335 430 300 430 240 C430 180 380 130 340 130 L395 130" 
          stroke="url(#flowGradient)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Sharp Precision Arrow Tip -->
    <path d="M360 90 L445 125 L410 210" 
          stroke="url(#flowGradient)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Negative Space Horizontal Accent (Rupee Crossbar Alignment Notch) -->
  <line x1="210" y1="216" x2="270" y2="216" stroke="#0B0F17" stroke-width="12" stroke-linecap="round" />
</svg>
