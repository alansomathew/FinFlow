name: finflow
description: FinFlow — Smart Personal Finance Manager
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
    
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # UI Components
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  animate_do: ^3.3.4
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # Authentication
  google_sign_in: ^6.2.1
  local_auth: ^2.3.0

  # Local Storage & Data
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3
  path: ^1.9.0

  # Networking
  dio: ^5.6.0
  http: ^1.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0

  # Permissions
  permission_handler: ^11.3.1

  # Image & File
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Icons
  cupertino_icons: ^1.0.6
  flutter_iconly: ^1.0.2
  flutter_sms_inbox: ^1.0.5


  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
